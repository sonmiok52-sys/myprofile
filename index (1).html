<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 소개 페이지</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.7;
    }

    .container {
      max-width: 760px;
      margin: 60px auto;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .profile {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .intro {
      font-size: 18px;
    }

    .section {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
    }

    .tags span {
      display: inline-block;
      margin: 5px;
      padding: 8px 14px;
      background: #eee;
      border-radius: 20px;
    }
  </style>
</head>

<body>
  <main class="container">
    <!-- profile.jpg 파일을 index.html과 같은 폴더에 넣으세요 -->
    <img class="profile" src="myphto.png" alt="프로필 이미지">

    <!-- 아래 내용을 나의 정보로 수정하세요 -->
    <h1>안녕하세요. 저는 손미옥입니다.</h1>
    <p class="intro">
      오랫동안 공직에서 근무했습니다.<br>
      요즘에는 합창과 운동,텃밭가꾸기등니다.<br>
      앞으로 AI를 활용해 새로운 것을 만들어보고 싶습니다.
    </p>

    <section class="section">
      <h2>제가 좋아하는 것</h2>
      <div class="tags">
        <span>합창</span>
        <span>운동</span>
        <span>텃밭가꾸기</span>
      </div>
    </section>

    <section class="section">
      <h2>앞으로 해보고 싶은 일</h2>
      <p>AI를 배우고 활용하면서 새로운 취미와 활동에 도전하고 싶습니다.</p>
    </section>
  </main>
</body>

</html>

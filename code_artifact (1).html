<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6 selection:bg-indigo-500 selection:text-white">

    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 md:p-10 text-center transition-all">
        
        <div class="relative group inline-block mb-6">
            <div class="w-36 h-36 md:w-40 md:h-40 rounded-full overflow-hidden ring-4 ring-indigo-500/10 shadow-inner mx-auto bg-slate-100 flex items-center justify-center">
                <!-- 기본적으로 같은 폴더의 profile.jpg를 로드하도록 설정 -->
                <img id="profileImage" src="myphto.png" alt="프로필 사진" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/300x300/e2e8f0/64748b?text=Photo';">
            </div>
            <!-- 사진 변경 클릭 가이드 (웹상에서 파일 선택 테스트용) -->
            <label for="imageUpload" class="absolute inset-0 rounded-full bg-black/40 text-white opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center cursor-pointer transition-opacity text-xs font-medium backdrop-blur-xs">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l0.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l0.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                사진 교체하기
            </label>
            <input type="file" id="imageUpload" accept="image/*" class="hidden">
        </div>

        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight mb-2">
            손미옥
        </h1>

        <p class="text-indigo-600 font-medium text-sm md:text-base mb-6">
            매일 합창하는 누나
        </p>

        <div class="w-12 h-0.5 bg-slate-200 mx-auto mb-6"></div>

        <div class="text-slate-600 text-sm md:text-base leading-relaxed space-y-2 text-center bg-slate-50/80 p-5 rounded-2xl border border-slate-100">
            <p>합창도 하고</p>
            <p>운동도 하고</p>
            <p>텃밭도 가꾸고</p>
        </div>

    </main>

    <script>
        // 로컬 사진 선택 시 즉시 화면에 미리보기 출력 기능
        document.getElementById('imageUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profileImage').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
